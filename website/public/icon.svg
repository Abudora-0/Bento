<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The mark, matching components/Wordmark.tsx. Hardcoded hexes rather than the
    palette tokens, because a standalone svg loaded as a favicon has no page to
    inherit custom properties from. If the palette moves, this moves with it.
      gutter #050506   print #e9e5dc   silver-dim #6d6e72   grease #cc352c
  -->
  <rect width="64" height="64" fill="#050506"/>

  <rect x="8" y="8" width="27" height="48" fill="#e9e5dc"/>
  <rect x="39" y="8" width="17" height="19" fill="#6d6e72"/>
  <rect x="39" y="31" width="17" height="25" fill="#e9e5dc"/>

  <!-- The grease pencil circle, the same gesture as starring a bookmark. -->
  <g transform="translate(21.5,32) scale(1.18) translate(-15,-15)">
    <path d="M20.8 5.9c4.4 1.6 6.4 6.7 4.6 11.1c-1.9 4.6-7.4 7.3-12.2 6.1C8.2 21.9 5 17.2 5.7 12.4C6.4 7.8 10.8 4.4 15.6 4.6c3.4.1 6.7 1.7 8.5 4.3c.5.8.9 1.6 1.1 2.5"
          fill="none" stroke="#cc352c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
